[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/dashboard"
  to = "/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard/:splat"
  status = 200

[[redirects]]
  from = "/stats"
  to = "/stats/index.html"
  status = 200

[[redirects]]
  from = "/stats/*"
  to = "/stats/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://arcx-v2fs.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://arcx-v2fs.onrender.com/health"
  status = 200
  force = true
