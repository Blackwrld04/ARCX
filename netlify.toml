[build]
  command = "npm run build:netlify"
  publish = "dist"

# Dashboard route rewrite
[[redirects]]
  from = "/dashboard"
  to = "/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard/:splat"
  status = 200

# Stats explorer GUI route rewrite
[[redirects]]
  from = "/stats"
  to = "/stats/index.html"
  status = 200

[[redirects]]
  from = "/stats/*"
  to = "/stats/:splat"
  status = 200

# Fallback proxy for API calls to Render backend
# (Can also be dynamically configured via BACKEND_URL in Netlify Environment Variables)
[[redirects]]
  from = "/api/*"
  to = "https://arcx.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://arcx.onrender.com/health"
  status = 200
  force = true
